# Página de issues do projeto. `first`/`after` é paginação Relay; o custo de
# complexidade multiplica os filhos pelo tamanho da página, então quem chama
# decide o `first` — não existe default generoso aqui.
query PipeIssuesList($id: String!, $first: Int!, $after: String) {
  project(id: $id) {
    issues(first: $first, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        id
        identifier
        title
        url
        createdAt
        updatedAt
        completedAt
        canceledAt
        priority
        state {
          name
          type
        }
        parent {
          id
        }
        labels {
          nodes {
            name
          }
        }
        relations {
          nodes {
            type
            relatedIssue {
              id
            }
          }
        }
        inverseRelations {
          nodes {
            type
            issue {
              id
            }
          }
        }
        # Só a URL do anexo. Título de anexo é texto livre e ficaria fora da
        # fronteira de docs/connectors/README.md; URL já é campo que o record guarda.
        attachments {
          nodes {
            url
          }
        }
      }
    }
  }
}
