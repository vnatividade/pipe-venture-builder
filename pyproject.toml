[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipe-venture-builder"
version = "0.1.0"
description = "Portable command-line foundation for governed AI product delivery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Pipe Venture Builder" }
]
dependencies = [
  "jsonschema>=4.23,<5",
  "rfc3339-validator>=0.1.4,<1"
]

[project.scripts]
pipe = "pipe_venture_builder.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# tests/fixtures guarda repositórios de exemplo com seus próprios arquivos de teste.
# Coletá-los quebra a suíte com ModuleNotFoundError — eles são dado, não teste.
# Sem isto, `pytest` puro falha e todo mundo aprende a passar --ignore à mão, que é
# como um comando de CI nasce diferente do comando que a pessoa roda.
norecursedirs = ["tests/fixtures", ".git", "node_modules", "runtime"]
testpaths = ["tests"]
