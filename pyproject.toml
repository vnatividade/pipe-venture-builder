[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipe-venture-builder"
version = "0.1.0"
description = "Portable command-line foundation for governed AI product delivery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Pipe Venture Builder" }
]
dependencies = [
  "jsonschema>=4.23,<5",
  "rfc3339-validator>=0.1.4,<1"
]

[project.scripts]
pipe = "pipe_venture_builder.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
